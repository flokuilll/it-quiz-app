</head>
<body>

  <main class="quiz-container">

    <section id="start-screen" class="screen">
      <p class="eyebrow">IT SKILL-UP QUIZ</p>
      <h1>ITスキルアップクイズ</h1>
      <p class="lead">
        HTML/CSS・JavaScript・ネットワーク・セキュリティ・開発ツールの
        全<strong>1000問</strong>から、毎回ランダムに<strong>100問</strong>を出題。<br>
        1問ごとに解説付きで、新社会人・学生の基礎固めにどうぞ。
      </p>

      <div id="progress-summary" class="progress-summary">
        <div class="progress-summary-row">
          <span class="progress-summary-label">全体の習得率</span>
          <span id="progress-summary-value" class="progress-summary-value">0 / 1000問 (0%)</span>
        </div>
        <div class="progress-summary-track">
          <div id="progress-summary-fill" class="progress-summary-fill"></div>
        </div>
      </div>

      <button id="start-btn" class="btn-primary">全問からランダムに挑戦</button>

      <p class="section-label">分野を絞って挑戦する</p>

      <ul id="category-list" class="category-list">
        <li>
          <button class="category-btn" data-category="HTML & CSS" style="--cat-color:#3D5AFE">
            <span class="dot" style="background:#3D5AFE"></span>
            <span class="category-btn-name">HTML &amp; CSS</span>
            <span class="category-btn-sub">200問からランダム100問</span>
          </button>
        </li>
        <li>
          <button class="category-btn" data-category="JavaScript / プログラミング" style="--cat-color:#00B37E">
            <span class="dot" style="background:#00B37E"></span>
            <span class="category-btn-name">JavaScript / プログラミング</span>
            <span class="category-btn-sub">200問からランダム100問</span>
          </button>
        </li>
        <li>
          <button class="category-btn" data-category="ネットワーク・インフラ" style="--cat-color:#F2994A">
            <span class="dot" style="background:#F2994A"></span>
            <span class="category-btn-name">ネットワーク・インフラ</span>
            <span class="category-btn-sub">200問からランダム100問</span>
          </button>
        </li>
        <li>
          <button class="category-btn" data-category="セキュリティ" style="--cat-color:#E64980">
            <span class="dot" style="background:#E64980"></span>
            <span class="category-btn-name">セキュリティ</span>
            <span class="category-btn-sub">200問からランダム100問</span>
          </button>
        </li>
        <li>
          <button class="category-btn" data-category="開発ツール・IT実務用語" style="--cat-color:#8854D0">
            <span class="dot" style="background:#8854D0"></span>
            <span class="category-btn-name">開発ツール・IT実務用語</span>
            <span class="category-btn-sub">200問からランダム100問</span>
          </button>
        </li>
      </ul>

      <p class="section-label">苦手問題の復習・学習履歴</p>

      <button id="review-btn" class="btn-secondary" disabled>苦手問題を復習する(0問)</button>

      <details id="history-details" class="history-details">
        <summary>直近の学習履歴を見る</summary>
        <ul id="history-list" class="history-list">
          <li class="history-empty">まだ学習履歴がありません。</li>
        </ul>
      </details>
    </section>

    <section id="quiz-screen" class="screen hidden">
      <div class="quiz-topbar">
        <span id="category-badge" class="category-badge"></span>
        <span id="score-badge" class="score-badge">スコア: 0</span>
      </div>

      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <p id="progress-label" class="progress-label">問題 1 / 100</p>

      <h2 id="question-text" class="question"></h2>

      <div id="answers" class="answers">
        <button class="answer-btn" data-index="0"></button>
        <button class="answer-btn" data-index="1"></button>
        <button class="answer-btn" data-index="2"></button>
        <button class="answer-btn" data-index="3"></button>
      </div>

      <div id="explanation-box" class="explanation-box hidden">
        <p id="explanation-text" class="explanation-text"></p>
        <button id="next-btn" class="btn-next">次の問題へ</button>
      </div>
    </section>

    <section id="result-screen" class="screen hidden">
      <p class="eyebrow">RESULT</p>
      <h2>結果発表</h2>
      <p id="result-text" class="result-score"></p>
      <p id="result-subtext" class="result-subtext"></p>

      <div class="share-buttons">
        <a id="share-x" class="share-btn share-x" href="#" target="_blank" rel="noopener noreferrer">
          <span>Xでシェア</span>
        </a>
        <a id="share-line" class="share-btn share-line" href="#" target="_blank" rel="noopener noreferrer">
          <span>LINEでシェア</span>
        </a>
      </div>

      <button id="restart-btn" class="btn-primary">もう一度挑戦する</button>
    </section>

  </main>

<script src="quiz-logic.js"></script>
</body>
</html>
