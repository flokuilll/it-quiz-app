<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITスキルアップクイズ | 全1000問からランダム出題</title>
<link rel="stylesheet" href="quiz-style.css">
</head>
<body>

  <main class="quiz-container">

    <section id="start-screen" class="screen">
      <p class="eyebrow">IT SKILL-UP QUIZ</p>
      <h1>ITスキルアップクイズ</h1>
      <p class="lead">
        HTML/CSS・JavaScript・ネットワーク・セキュリティ・開発ツールの
        全<strong>1000問</strong>から、毎回ランダムに<strong>100問</strong>を出題。<br>
        1問ごとに解説付きで、新社会人・学生の基礎固めにどうぞ。
      </p>

      <ul class="category-list">
        <li><span class="dot" style="background:#3D5AFE"></span>HTML &amp; CSS</li>
        <li><span class="dot" style="background:#00B37E"></span>JavaScript / プログラミング</li>
        <li><span class="dot" style="background:#F2994A"></span>ネットワーク・インフラ</li>
        <li><span class="dot" style="background:#E64980"></span>セキュリティ</li>
        <li><span class="dot" style="background:#8854D0"></span>開発ツール・IT実務用語</li>
      </ul>

      <button id="start-btn" class="btn-primary">クイズを始める</button>
    </section>

    <section id="quiz-screen" class="screen hidden">
      <div class="quiz-topbar">
        <span id="category-badge" class="category-badge"></span>
        <span id="score-badge" class="score-badge">スコア: 0</span>
      </div>

      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <p id="progress-label" class="progress-label">問題 1 / 100</p>

      <h2 id="question-text" class="question"></h2>

      <div id="answers" class="answers">
        <button class="answer-btn" data-index="0"></button>
        <button class="answer-btn" data-index="1"></button>
        <button class="answer-btn" data-index="2"></button>
        <button class="answer-btn" data-index="3"></button>
      </div>

      <div id="explanation-box" class="explanation-box hidden">
        <p id="explanation-text" class="explanation-text"></p>
        <button id="next-btn" class="btn-next">次の問題へ</button>
      </div>
    </section>

    <section id="result-screen" class="screen hidden">
      <p class="eyebrow">RESULT</p>
      <h2>結果発表</h2>
      <p id="result-text" class="result-score"></p>
      <p id="result-subtext" class="result-subtext"></p>
      <button id="restart-btn" class="btn-primary">もう一度挑戦する</button>
    </section>

  </main>

<script src="quiz-logic.js"></script>
</body>
</html>
